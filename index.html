const prev=[];Object.keys(COL).forEach((k,i)=>{const b=document.createElement("button"),c=document.createElement("canvas");c.width=c.height=72;b.append(c);b.title=k;b.onclick=()=>{selCol=k;mark()};b.dataset.k=k;$("cols").append(b);prev.push({g:c.getContext("2d"),k,i})});

// ----- Firebase -----
async function net(){
 if(CFG.apiKey.startsWith("COLE")){$("st").textContent="Modo offline: configure o Firebase para o multiplayer.";return}
 try{
  const V="https://www.gstatic.com/firebasejs/10.12.2/";
  const [a,au,fs]=await Promise.all([import(V+"firebase-app.js"),import(V+"firebase-auth.js"),import(V+"firebase-firestore.js")]);
  const app=a.initializeApp(CFG),auth=au.getAuth(app);db=fs.getFirestore(app);fb=fs;
  uid=(await au.signInAnonymously(auth)).user.uid;ON=true;
  fs.onSnapshot(fs.collection(db,"players"),s=>{s.docChanges().forEach(c=>{
   const id=c.doc.id;if(id===uid)return;
   if(c.type==="removed"){delete others[id];return}
   const v=c.doc.data(),o=others[id]||(others[id]={rx:v.x,ry:v.y,es:0,eT:0});

  })});
  let first=true;
  fs.onSnapshot(fs.query(fs.collection(db,"chat"),fs.orderBy("t","desc"),fs.limit(30)),s=>{
   if(!first)s.docChanges().forEach(c=>{if(c.type==="added"){const d=c.doc.data();bubbles[d.uid]={t:d.text,at:Date.now()}}});
   first=false;chatArr=[];s.forEach(d=>chatArr.push(d.data()));chatArr.reverse();renderChat()});
  setInterval(push,500);
  addEventListener("beforeunload",()=>fs.deleteDoc(fs.doc(db,"players",uid)));
 }catch(e){ON=false;$("st").textContent="Erro no Firebase: "+(e.code||e.message)}
}
let last={x:0,y:0,e:0,at:0};
function push(){
 if(!ON||!started)return;const now=Date.now(),x=Math.round(me.x),y=Math.round(me.y);
 if(x===last.x&&y===last.y&&me.emT===last.e&&me.a===last.a&&now-last.at<5000)return;
 last={x,y,e:me.emT,a:me.a,at:now};
 fb.setDoc(fb.doc(db,"players",uid),{name:me.name,color:me.col,x,y,f:me.f,em:me.em,emT:me.emT,sx:me.sx,a:me.a|0,dead:me.dead?1:0,t:fb.serverTimestamp()}).catch(()=>{});
}

 const t=$("ci").value.trim();if(!t||Date.now()-lastSend<1000)return;lastSend=Date.now();$("ci").value="";
 if(ON)fb.addDoc(fb.collection(db,"chat"),{uid,name:me.name,text:t,t:fb.serverTimestamp()}).catch(()=>{});

}
function renderChat(){const m=$("msgs");m.innerHTML="";chatArr.forEach(d=>{const r=document.createElement("div"),b=document.createElement("b"),s=document.createElement("span");b.textContent=d.name;b.style.color="hsl("+([...d.name].reduce((a,c)=>a+c.charCodeAt(0)*7,0)%360)+" 85% 75%)";s.textContent=d.text;r.append(b,s);m.append(r)});m.scrollTop=1e9}

document.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{me.em=b.dataset.e;me.emT=Date.now();me.es=Date.now()});

addEventListener("keydown",e=>{if(e.target.tagName!=="INPUT")keys[e.key.toLowerCase()]=1});

 g.strokeStyle=C.w;g.globalAlpha=.5;g.lineWidth=1.2;g.beginPath();for(let i=0;i<5;i++){g.moveTo(-12+i*3.4,-10.5);g.quadraticCurveTo(-10.5+i*3.4,-8,-12+i*3.4,-5.5)}g.stroke();g.globalAlpha=1;
